[package]
name = "dupfinder-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for duplicate file detection and cleanup recommendations"
license = "MIT"

[[bin]]
name = "dupfinder"
path = "src/main.rs"

[dependencies]
dupfinder-core = { path = "../dupfinder-core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
serde_json = "1"
chrono = "0.4"
