[package]
name = "dupfinder-core"
version = "0.1.0"
edition = "2021"
description = "Core library for duplicate file detection and filesystem analysis"
license = "MIT"

[dependencies]
blake3 = "1"
rayon = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
