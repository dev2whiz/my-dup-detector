name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: dupfinder
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: dupfinder
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: dupfinder
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dupfinder.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p dupfinder-cli

      - name: Determine tag name
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ARCHIVE_DIR="dupfinder-${TAG}-${{ matrix.target }}"
          ARCHIVE_FILE="${ARCHIVE_DIR}.${{ matrix.archive_ext }}"
          
          mkdir -p "dist/${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${ARCHIVE_DIR}/"
          cp README.md LICENSE "dist/${ARCHIVE_DIR}/"
          
          cd dist
          tar -czvf "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          else
            shasum -a 256 "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          fi
          rm -rf "${ARCHIVE_DIR}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = "${{ steps.vars.outputs.tag }}"
          $ARCHIVE_DIR = "dupfinder-${TAG}-${{ matrix.target }}"
          $ARCHIVE_FILE = "${ARCHIVE_DIR}.${{ matrix.archive_ext }}"
          
          New-Item -ItemType Directory -Force -Path "dist/$ARCHIVE_DIR"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/$ARCHIVE_DIR/"
          Copy-Item "README.md" "dist/$ARCHIVE_DIR/"
          Copy-Item "LICENSE" "dist/$ARCHIVE_DIR/"
          
          Compress-Archive -Path "dist/$ARCHIVE_DIR/*" -DestinationPath "dist/$ARCHIVE_FILE" -Force
          $HASH = (Get-FileHash -Path "dist/$ARCHIVE_FILE" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$ARCHIVE_FILE.sha256" -Value "$HASH  $ARCHIVE_FILE"
          Remove-Item -Recurse -Force "dist/$ARCHIVE_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "${{ steps.vars.outputs.tag }} — Initial Release"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
